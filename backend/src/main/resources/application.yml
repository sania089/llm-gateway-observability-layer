spring:
  application:
    name: llm-gateway
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/gateway}
    username: ${POSTGRES_USER:gateway}
    password: ${POSTGRES_PASSWORD:change-me}
  flyway:
    enabled: true

server:
  shutdown: graceful

gateway:
  providers:
    gemini:
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
      api-key: ${GEMINI_API_KEY:}
      connect-timeout: 5s
      read-timeout: 60s
      model-prefixes: gemini-
      # Free-tier guards: keep local limits just under the provider quota (override via env).
      requests-per-minute: ${GEMINI_RPM:10}
      max-concurrent: ${GEMINI_MAX_CONCURRENT:4}
      max-attempts: 3
      initial-backoff: 500ms
      max-backoff: 8s
      throttle-max-wait: 5s
    groq:
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
      api-key: ${GROQ_API_KEY:}
      connect-timeout: 5s
      read-timeout: 60s
      model-prefixes: ${GROQ_MODEL_PREFIXES:llama-,gemma,qwen,openai/,deepseek-,mixtral-}
      requests-per-minute: ${GROQ_RPM:25}
      max-concurrent: ${GROQ_MAX_CONCURRENT:4}
      max-attempts: 3
      initial-backoff: 500ms
      max-backoff: 8s
      throttle-max-wait: 5s
  proxy:
    stream-timeout: 5m
    max-input-chars: ${GATEWAY_MAX_INPUT_CHARS:100000}
    max-output-tokens: ${GATEWAY_MAX_OUTPUT_TOKENS:2048}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
