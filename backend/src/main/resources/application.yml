spring:
  application:
    name: llm-gateway
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/gateway}
    username: ${POSTGRES_USER:gateway}
    password: ${POSTGRES_PASSWORD:change-me}
  flyway:
    enabled: true

server:
  shutdown: graceful

gateway:
  providers:
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      api-key: ${OPENAI_API_KEY:}
      connect-timeout: 5s
      read-timeout: 60s
      model-prefixes: ${OPENAI_MODEL_PREFIXES:gpt-,o1,o3,o4}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
